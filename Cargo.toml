[package]
name = "remage"
version = "0.1.0"
edition = "2024"
description = "Keyboard-centric image viewer with a Nothing-inspired look"
rust-version = "1.96"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
env_logger = "0.11.11"
fast_image_resize = "6.1.0"
glyphon = "0.12.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp", "ico", "tga", "pnm", "qoi", "dds", "hdr", "exr"] }
jpeg-decoder = "0.3.2"
jxl-oxide = { version = "0.12.6", optional = true, features = ["moxcms"] }
kamadak-exif = "0.6.1"
libheif-rs = { version = "3.0.0", optional = true }
log = "0.4.35"
md-5 = "0.11.0"
moxcms = "0.9.1"
notify = "8.2.1"
nucleo-matcher = "0.3.1"
png = "0.18.1"
pollster = "1.0.1"
rawler = { version = "0.8.0", optional = true }
resvg = { version = "0.49.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
thiserror = "2.0.21"
tiff = "0.11.3"
toml = "1.2.0"
wgpu = "30"
winit = "0.30"

[features]
default = ["jxl", "svg", "avif", "heif", "raw"]
jxl = ["dep:jxl-oxide"]
svg = ["dep:resvg"]
avif = ["image/avif-native"] # system dav1d
heif = ["dep:libheif-rs"]    # system libheif
raw = ["dep:rawler"]

[profile.release]
lto = "thin"
codegen-units = 1

# Decoders are unusably slow unoptimised; keep our own crate fast to rebuild.
[profile.dev.package."*"]
opt-level = 3
