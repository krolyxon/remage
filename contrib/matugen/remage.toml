# matugen template for remage.
#
# 1. Copy to ~/.config/matugen/templates/remage.toml
# 2. In ~/.config/matugen/config.toml:
#      [templates.remage]
#      input_path = '~/.config/matugen/templates/remage.toml'
#      output_path = '~/.cache/matugen/remage.toml'
# 3. In ~/.config/remage/config.toml:
#      include = ["~/.cache/matugen/remage.toml"]
#
# remage watches the include, so every wallpaper change recolours open windows; no post_hook.
# Only three colours are needed: every other token is derived from them.
[theme]
background = "{{colors.surface_container_lowest.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"
accent     = "{{colors.primary.default.hex}}"
